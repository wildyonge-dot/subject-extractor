<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Extractor - Curate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --text-color: #e2e8f0;
            --accent-color: #8b5cf6;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --selected-border: #8b5cf6;
            --glass-bg: rgba(15, 17, 21, 0.8);
            --glass-border: rgba(255, 255, 255, 0.05);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(139, 92, 246, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(56, 189, 248, 0.1), transparent 40%);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 1rem;
            z-index: 100;
        }
        h1 {
            margin: 0;
            font-weight: 600;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
        }
        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
            filter: brightness(1.1);
        }
        button:active {
            transform: translateY(1px);
        }
        button.secondary {
            background-color: rgba(255, 255, 255, 0.1);
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        button.secondary:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .input-group label {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        input[type="password"], input[type="text"] {
            padding: 0.6rem;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--accent-color);
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 0 0.5rem;
        }
        .badge-count {
            background: var(--accent-color);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .toggle-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.2);
            transition: .3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--accent-color);
        }
        input:checked + .slider:before {
            transform: translateX(18px);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid var(--card-border);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .card.selected {
            border-color: var(--selected-border);
            background: rgba(139, 92, 246, 0.1);
            box-shadow: 0 0 0 2px var(--selected-border), 0 10px 25px rgba(139, 92, 246, 0.2);
        }
        .img-container {
            width: 100%;
            height: 220px;
            position: relative;
            overflow: hidden;
            background-color: #000;
        }
        .checkerboard .img-container {
            background-image: linear-gradient(45deg, #2a2a2a 25%, transparent 25%), 
                              linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #2a2a2a 75%), 
                              linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        .card:hover img {
            transform: scale(1.05);
        }
        .card-info {
            padding: 1rem;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--card-border);
        }
        .card-id {
            font-weight: 500;
            color: #f8fafc;
        }
        .card-area {
            color: #94a3b8;
            font-size: 0.8rem;
        }
        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: var(--accent-color);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .card.selected .badge {
            opacity: 1;
            transform: scale(1);
        }
        .keyboard-hints {
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
            margin-top: 2rem;
        }
        kbd {
            background: rgba(255,255,255,0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            font-family: monospace;
            color: #cbd5e1;
        }
        #status-message {
            margin-top: 10vh;
            font-size: 1.5rem;
            color: #4ade80;
            text-align: center;
            display: none;
            background: var(--glass-bg);
            padding: 3rem;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="checkerboard">

    <header id="main-header">
        <div>
            <h1>Subject Extractor</h1>
        </div>
        <div class="controls">
            <div class="input-group">
                <input type="password" id="api-key" placeholder="DeepSeek API Key (opt)">
            </div>
            <button class="secondary" onclick="toggleAll()">Toggle All</button>
            <button id="submit-btn" onclick="submitSelection()">
                <span class="spinner" id="spinner"></span>
                <span id="btn-text">Extract Selected</span>
            </button>
        </div>
    </header>

    <div id="main-content">
        <div class="toolbar">
            <div>
                Selected: <span class="badge-count" id="selected-count">0</span> / <span id="total-count">0</span>
            </div>
            <div class="toggle-group">
                <span>Checkerboard</span>
                <label class="switch">
                    <input type="checkbox" id="checkerboard-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="grid" id="grid">
            <!-- Cards will be populated here -->
        </div>
        
        <div class="keyboard-hints">
            Shortcuts: <kbd>A</kbd> Select All • <kbd>D</kbd> Deselect All • <kbd>Enter</kbd> Submit
        </div>
    </div>
    
    <div id="status-message">
        <div style="font-size: 3rem; margin-bottom: 1rem;">✨</div>
        <div id="status-text"></div>
    </div>

    <script>
        let masks = [];
        const selectedIds = new Set();

        async function fetchMasks() {
            try {
                const response = await fetch('/api/masks');
                const data = await response.json();
                masks = data.masks;
                document.getElementById('total-count').innerText = masks.length;
                renderGrid();
            } catch (error) {
                console.error("Error fetching masks:", error);
            }
        }

        function toggleSelection(id) {
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
            } else {
                selectedIds.add(id);
            }
            updateCardUI(id);
            updateCounts();
        }

        function updateCardUI(id) {
            const card = document.getElementById(`card-${id}`);
            if (card) {
                if (selectedIds.has(id)) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            }
        }

        function updateCounts() {
            document.getElementById('selected-count').innerText = selectedIds.size;
        }

        function toggleAll() {
            const allSelected = selectedIds.size === masks.length;
            if (allSelected) {
                selectedIds.clear();
            } else {
                masks.forEach(m => selectedIds.add(m.id));
            }
            masks.forEach(m => updateCardUI(m.id));
            updateCounts();
        }
        
        function deselectAll() {
            selectedIds.clear();
            masks.forEach(m => updateCardUI(m.id));
            updateCounts();
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            masks.forEach(mask => {
                const isSelected = selectedIds.has(mask.id);
                const card = document.createElement('div');
                card.className = `card ${isSelected ? 'selected' : ''}`;
                card.id = `card-${mask.id}`;
                card.onclick = () => toggleSelection(mask.id);
                
                card.innerHTML = `
                    <div class="badge">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <div class="img-container">
                        <img src="/outputs/${mask.thumb_file}" alt="Mask ${mask.id}" loading="lazy">
                    </div>
                    <div class="card-info">
                        <span class="card-id">${mask.id}</span>
                        <span class="card-area">Area: ${(mask.area/1000).toFixed(1)}k</span>
                    </div>
                `;
                grid.appendChild(card);
            });
            updateCounts();
        }

        async function submitSelection() {
            if (selectedIds.size === 0) {
                alert("Please select at least one subject.");
                return;
            }
            
            const btn = document.getElementById('submit-btn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btn-text');
            
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.innerText = 'Submitting...';
            
            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        selected_ids: Array.from(selectedIds),
                        api_key: document.getElementById('api-key').value.trim() || null
                    })
                });
                
                const result = await response.json();
                
                if (response.ok && result.status === 'ok') {
                    document.getElementById('main-header').style.display = 'none';
                    document.getElementById('main-content').style.display = 'none';
                    
                    const msg = document.getElementById('status-message');
                    document.getElementById('status-text').textContent = result.message;
                    msg.style.display = 'block';
                } else {
                    alert(result.detail || "Failed to submit selection.");
                    btn.disabled = false;
                    spinner.style.display = 'none';
                    btnText.innerText = 'Extract Selected';
                }
            } catch (error) {
                console.error("Error submitting:", error);
                alert("Failed to submit selection.");
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.innerText = 'Extract Selected';
            }
        }

        // Checkerboard toggle
        document.getElementById('checkerboard-toggle').addEventListener('change', (e) => {
            if (e.target.checked) {
                document.body.classList.add('checkerboard');
            } else {
                document.body.classList.remove('checkerboard');
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Ignore if typing in input
            if (e.target.tagName === 'INPUT') {
                if (e.key === 'Enter') {
                    submitSelection();
                }
                return;
            }
            
            if (e.key.toLowerCase() === 'a' && !e.ctrlKey && !e.metaKey) {
                masks.forEach(m => selectedIds.add(m.id));
                masks.forEach(m => updateCardUI(m.id));
                updateCounts();
            } else if (e.key.toLowerCase() === 'd' && !e.ctrlKey && !e.metaKey) {
                deselectAll();
            } else if (e.key === 'Enter') {
                submitSelection();
            }
        });

        // Initialize
        fetchMasks();
    </script>
</body>
</html>
